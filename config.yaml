# All experiment settings. The code reads everything from here.
# Why each value was chosen: the comments below, and notes/olivia_steps_4-6_notes.md for steps 4 to 6.

source_language: por_Latn    # Portuguese: the text we remove accents from
target_language: eng_Latn    # English: the translations and the reference answers
split: devtest               # which FLORES+ split we report on (1012 sentences)
seed: 0                      # fixes every random choice, so runs repeat exactly

dictionary: data/raw/pt_BR   # step 2: pt_BR Hunspell files without .dic/.aff
                             #   (download with scripts/get_dictionary.sh)
min_zipf: 99                 # step 2: Class B words rarer than this go to the native speaker
                             #   99: every Class B word goes to the native speaker (frequency lists also count text typed without accents)
review_sample: 50            # step 2: extra random words the native speaker checks
normalize_unicode: {}        # step 2: characters to unify first (none for Portuguese)

versions:                    # step 3
  - clean
  - stripped_100
  - a_only
  - b_only
  - noise

systems:                     # step 4: exact model names
  nllb: facebook/nllb-200-distilled-600M
  opus_mt: Helsinki-NLP/opus-mt-ROMANCE-en    # there is no official pt-en model
  llm: Qwen/Qwen2.5-7B-Instruct               # why: notes/olivia_steps_4-6_notes.md
llm_4bit: true               # step 4: load the LLM in 4-bit, so it fits a free Colab GPU
llm_prompt: |                # step 4: {text} is replaced by the Portuguese sentence
  Translate the following Portuguese sentence into English. Output only the English translation, with no notes or explanations.

  Portuguese: {text}
  English:
translation:                 # step 4: decoding settings, the same in every run
  batch_size: 16             #   sentences per batch; lower it if the GPU runs out of memory
  num_beams: 4               #   beam search for NLLB and Opus-MT (the LLM uses no sampling)
  max_new_tokens: 256        #   longest translation, in tokens

comet_model: Unbabel/wmt22-comet-da   # step 5
