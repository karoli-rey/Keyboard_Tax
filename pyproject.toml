[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keyboard-tax"
version = "0.1.0"
description = "What diacritic loss costs machine translation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Lucia Ivan" },
  { name = "Karen Olivia Reyes Mendoza" },
  { name = "Thomas Schurter" },
]
# The base install runs the tests, results.ipynb and steps 1-3 and 6 on any Python >= 3.10.
# The translation and COMET models (steps 4-5) are an extra, because torch has no release
# for the newest Python versions yet: install them on Python 3.11 or 3.12 (Colab has them).
dependencies = [
  "pandas",
  "pyyaml",
  "matplotlib",
  "sacrebleu",
  "datasets",
  "spylls==0.1.7",
  "wordfreq==3.1.1",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
models = [               # steps 4 and 5: translation models and COMET
  "torch",
  "transformers",
  "sentencepiece",
  "accelerate",
  "sacremoses",
  "unbabel-comet",
]
gpu = ["bitsandbytes"]   # 4-bit loading of the LLM, only on a GPU machine (Colab)

[tool.hatch.build.targets.wheel]
packages = ["src/keyboard_tax"]

[tool.ruff]
line-length = 100
